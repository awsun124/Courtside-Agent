name: Daily collection

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      FREE_NEWS_API_KEY: ${{ secrets.FREE_NEWS_API_KEY }}
      ENABLE_LLM_CALLS: 'false'
      ENABLE_SAMPLE_AI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate configuration
        run: python -c "import os; assert os.environ.get('DATABASE_URL', '').startswith(('postgres://', 'postgresql://')), 'Set the DATABASE_URL repository secret'"
      - run: python -m scripts.collect_daily
